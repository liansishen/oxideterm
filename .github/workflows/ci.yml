name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, experiment/rust-native-v2]

permissions:
  contents: read

# Match the Tauri CI behavior: newer commits replace stale checks for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Windows job is the only place cfg(windows) code is compiled, so it is gated
  # on native sources changing instead of running for every pull request.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether native platform sources changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            echo "native=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}" HEAD | grep -qE '^(crates/|\.github/workflows/ci\.yml|Cargo\.toml|Cargo\.lock|rustfmt\.toml)'; then
            echo "native=true" >> "${GITHUB_OUTPUT}"
          else
            echo "native=false" >> "${GITHUB_OUTPUT}"
          fi
  rust:
    name: Rust workspace (check + fmt + test)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: false

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --workspace

  i18n:
    name: i18n completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Audit native locale catalogs
        run: python scripts/quality/audit_i18n.py

      - name: Test native packaging helpers
        run: python -m unittest scripts.tests.test_package_native scripts.tests.test_verify_native_package scripts.tests.test_compose_release_notes

  windows:
    name: Windows native check
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: native-check-windows-x64
          cache-on-failure: false

      - name: Check Windows GPUI backend
        run: cargo check -p gpui_windows

      - name: Test Windows frame and quit message handling
        run: cargo test -p gpui_windows --lib windows_message_

      - name: Test Windows text fallback identity
        run: cargo test -p gpui_windows --lib windows_text_

      - name: Check Windows application
        run: cargo check -p oxideterm-gpui-app
