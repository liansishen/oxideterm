name: Native Package
run-name: Native Package ${{ inputs.release_tag || inputs.version || github.sha }}

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      release_tag:
        required: false
        type: string
      upload_release:
        required: false
        type: boolean
      fork_release:
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      fork_release:
        description: Fork version and release channel (internal reusable workflow input)
        required: false
        default: false
        type: boolean
      version:
        description: 'Optional artifact version override, for example 0.1.0-preview.1'
        required: false
        type: string
      release_tag:
        description: 'Existing release tag to publish, for example v2.0.25'
        required: false
        type: string
      upload_release:
        description: 'Upload artifacts to release_tag'
        required: false
        default: false
        type: boolean
  # Packaging runs when a merged pull request lands on main. A direct push to main
  # still creates a run, but the source-merge gate skips every job. Publishing always
  # requires a manual dispatch with upload_release.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/release/**'
      - '.github/workflows/native-package.yml'

permissions:
  contents: read

concurrency:
  group: native-package-${{ inputs.release_tag || github.sha }}
  cancel-in-progress: true

jobs:
  source_merge:
    name: Require a merged pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - name: Check whether the pushed commit came from a merged pull request
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "push" ]; then
            echo "merged=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          merged_count="$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "${merged_count}" -gt 0 ]; then
            echo "merged=true" >> "${GITHUB_OUTPUT}"
          else
            echo "merged=false" >> "${GITHUB_OUTPUT}"
          fi

  validate-release-request:
    name: Validate release request
    needs: source_merge
    if: needs.source_merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    outputs:
      raw_version: ${{ steps.release_request.outputs.raw_version }}
      release_commit: ${{ steps.release_request.outputs.release_commit }}
      release_tag: ${{ steps.release_request.outputs.release_tag }}
      version: ${{ steps.release_request.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version, tag, and commit
        id: release_request
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD_RELEASE: ${{ inputs.upload_release }}
          INPUT_FORK_RELEASE: ${{ inputs.fork_release }}
        run: |
          set -euo pipefail

          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          raw_version="${INPUT_VERSION:-${workspace_version}}"
          release_commit="${GITHUB_SHA}"
          release_tag=""

          if [[ "${INPUT_UPLOAD_RELEASE}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Release publishing must be dispatched from main, not ${GITHUB_REF}." >&2
              exit 1
            fi
            if [[ -z "${INPUT_RELEASE_TAG}" ]]; then
              echo 'Release publishing requires release_tag.' >&2
              exit 1
            fi
            if [[ "${INPUT_FORK_RELEASE:-false}" == true ]]; then
              [[ "${INPUT_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+fork\.[1-9][0-9]*$ ]] || { echo 'Invalid fork release tag.' >&2; exit 1; }
            elif [[ ! "${INPUT_RELEASE_TAG}" =~ ^(v|native-v|gpui-v)[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Unsupported release tag: ${INPUT_RELEASE_TAG}" >&2
              exit 1
            fi

            release_tag="${INPUT_RELEASE_TAG}"
            raw_version="${release_tag}"
            git fetch --no-tags origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            tag_commit="$(git rev-list -n 1 "refs/tags/${release_tag}")"
            git fetch --no-tags origin main
            validation_base="${GITHUB_SHA}"
            if [[ "${INPUT_FORK_RELEASE:-false}" == true ]]; then validation_base="origin/main"; fi
            if ! git merge-base --is-ancestor "${tag_commit}" "${validation_base}"; then
              echo "Release tag ${release_tag} points outside dispatched main history." >&2
              exit 1
            fi
            release_commit="${tag_commit}"
            workspace_version="$(git show "${release_commit}:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')"
          elif [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            echo 'release_tag is only valid when upload_release is enabled.' >&2
            exit 1
          fi

          version="${raw_version#native-v}"
          version="${version#gpui-v}"
          version="${version#v}"
          if [[ "${INPUT_UPLOAD_RELEASE}" == "true" && -n "${INPUT_VERSION}" ]]; then
            input_version="${INPUT_VERSION#native-v}"
            input_version="${input_version#gpui-v}"
            input_version="${input_version#v}"
            if [[ "${input_version}" != "${version}" ]]; then
              echo "version input ${input_version} does not match release tag version ${version}." >&2
              exit 1
            fi
          fi
          if [[ "${INPUT_UPLOAD_RELEASE}" != "true" ]]; then
            python3 scripts/release/bump_version.py "${version}" --dry-run
          fi
          if [[ "${version}" != "${workspace_version}" ]]; then
            echo "Requested version ${version} does not match workspace version ${workspace_version}." >&2
            exit 1
          fi

          {
            echo "raw_version=${raw_version}"
            echo "release_commit=${release_commit}"
            echo "release_tag=${release_tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

  # ── Release packaging target: Windows x64 ──────────────────────────────
  package:
    name: Package ${{ matrix.label }}
    needs: validate-release-request
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release-request.outputs.release_commit }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Rust cache
        id: rust_cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Release dispatches stay on main while checkout selects the tagged commit, so this
          # target-specific prefix can restore compatible dependency artifacts across versions.
          key: native-package-${{ matrix.target }}
          # Keep the compiled cache even when a build fails so a single-platform
          # retry resumes incrementally instead of rebuilding from scratch.
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          extra_packages: 'curl file patchelf desktop-file-utils dpkg-dev rpm freerdp2-dev'

      - name: Install Linux AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              appimage_arch="x86_64"
              appimage_sha256="b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2"
              ;;
            aarch64-unknown-linux-gnu)
              appimage_arch="aarch64"
              appimage_sha256="a48972e5ae91c944c5a7c80214e7e0a42dd6aa3ae979d8756203512a74ff574d"
              ;;
            *) echo "Unsupported AppImage target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          curl -L --retry 3 \
            -o appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${appimage_arch}.AppImage"
          echo "${appimage_sha256}  appimagetool" | sha256sum --check --strict
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NSIS_VERSION: '3.12'
          NSIS_ARCHIVE_SHA256: '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
        run: |
          # Download the official portable archive without relying on Chocolatey's OData feed.
          $archiveName = "nsis-$env:NSIS_VERSION.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $downloadUrl = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/$archiveName"
          curl.exe --fail --location --retry 3 --retry-all-errors `
            --output $archivePath $downloadUrl

          $archiveHash = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:NSIS_ARCHIVE_SHA256) {
            throw "NSIS archive checksum mismatch: $archiveHash"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION-portable"
          Expand-Archive -Path $archivePath -DestinationPath $extractRoot -Force
          $nsisBin = Join-Path $extractRoot "nsis-$env:NSIS_VERSION"
          if (-not (Test-Path (Join-Path $nsisBin 'makensis.exe'))) {
            throw 'makensis.exe is missing from the verified NSIS archive.'
          }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # GitHub-hosted Windows runners include 7-Zip; avoid a redundant feed request.
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            throw '7-Zip is missing from the GitHub-hosted Windows runner.'
          }

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
          WINDOWS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERTIFICATE_BASE64)) {
            Write-Host 'Windows signing certificate is not configured; producing an unsigned development artifact.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'oxideterm-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGN_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_SIGN_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Remove-Item $certificatePath -Force
          "WINDOWS_SIGN_CERT_SHA1=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGN_CERTIFICATE_BASE64 }}
          MACOS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_SIGN_CERTIFICATE_BASE64:-}" ]]; then
            echo 'macOS signing certificate is not configured; using ad-hoc signing.'
            exit 0
          fi

          keychain_path="${RUNNER_TEMP}/oxideterm-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          certificate_path="${RUNNER_TEMP}/oxideterm-signing.p12"
          identity_path="${RUNNER_TEMP}/oxideterm-signing.pem"
          printf '%s' "${MACOS_SIGN_CERTIFICATE_BASE64}" | openssl base64 -d -A > "${certificate_path}"
          chmod 600 "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          openssl pkcs12 \
            -in "${certificate_path}" \
            -passin env:MACOS_SIGN_CERTIFICATE_PASSWORD \
            -nodes \
            -out "${identity_path}"
          chmod 600 "${identity_path}"
          security import "${identity_path}" \
            -k "${keychain_path}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          signing_identity="$(security find-identity -v -p codesigning "${keychain_path}" | awk 'NR == 1 { print $2 }')"
          if [[ -z "${signing_identity}" ]]; then
            echo 'Imported macOS certificate did not expose a code-signing identity.' >&2
            exit 1
          fi
          {
            echo "MACOS_CODESIGN_IDENTITY=${signing_identity}"
            echo "MACOS_SIGNING_KEYCHAIN=${keychain_path}"
          } >> "${GITHUB_ENV}"

          if [[ -n "${MACOS_NOTARY_KEY_BASE64:-}" ]]; then
            if [[ -z "${MACOS_NOTARY_KEY_ID:-}" || -z "${MACOS_NOTARY_ISSUER_ID:-}" ]]; then
              echo 'macOS notarization key requires key id and issuer id.' >&2
              exit 1
            fi
            notary_key_path="${RUNNER_TEMP}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
            printf '%s' "${MACOS_NOTARY_KEY_BASE64}" | openssl base64 -d -A > "${notary_key_path}"
            chmod 600 "${notary_key_path}"
            {
              echo "MACOS_NOTARY_KEY_PATH=${notary_key_path}"
              echo "MACOS_NOTARY_KEY_ID=${MACOS_NOTARY_KEY_ID}"
              echo "MACOS_NOTARY_ISSUER_ID=${MACOS_NOTARY_ISSUER_ID}"
            } >> "${GITHUB_ENV}"
          fi

          rm -f "${certificate_path}" "${identity_path}"

      - name: Package native app
        env:
          OXIDETERM_VERSION: ${{ needs.validate-release-request.outputs.raw_version }}
          OXIDETERM_UPDATE_REPOSITORY: ${{ github.repository != 'AnalyseDeCircuit/oxideterm' && vars.OXIDETERM_UPDATER_PUBKEY != '' && github.repository || '' }}
          OXIDETERM_UPDATER_PUBKEY: ${{ vars.OXIDETERM_UPDATER_PUBKEY }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python scripts/release/package_native.py ${{ matrix.target }}

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8
          if [[ "${RUNNER_OS}" == 'macOS' && -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${MACOS_SIGNING_KEYCHAIN}" || true
          fi

      - name: Verify native package contents
        run: >-
          python scripts/release/verify_native_package.py
          --target ${{ matrix.target }}
          --version ${{ needs.validate-release-request.outputs.raw_version }}
          --dist dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OxideTerm-${{ matrix.label }}
          path: |
            dist/*.app.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      - name: Retire superseded package caches for this target
        if: success() && github.ref == 'refs/heads/main' && steps.rust_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CACHE_KEY_FRAGMENT: native-package-${{ matrix.target }}
        with:
          script: |
            // Delete the restored partial cache only after a successful package build. The
            // rust-cache post step then saves the new main-scoped key without retaining one
            // cache per release tag or version.
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const matchingCaches = caches.filter((cache) =>
              cache.key.includes(process.env.CACHE_KEY_FRAGMENT),
            );
            for (const cache of matchingCaches) {
              core.info(`Deleting superseded cache ${cache.key} (${cache.id}).`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }

  release:
    name: Publish release assets
    needs:
      - validate-release-request
      - package
    runs-on: ubuntu-latest
    if: inputs.upload_release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release-request.outputs.release_commit }}

      - name: Protect published fork releases
        if: inputs.fork_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.validate-release-request.outputs.release_tag }}
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === process.env.RELEASE_TAG);
            if (release && !release.draft) {
              throw new Error('This fork release is already published. Start a new Fork Release run to allocate the next revision.');
            }
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: OxideTerm-*
          path: dist-release
          merge-multiple: true

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-release-request.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate-release-request.outputs.version }}
        run: |
          set -euo pipefail

          prerelease=false
          if [[ "${RELEASE_TAG}" == native-v* || "${RELEASE_TAG}" == gpui-v* || "${RELEASE_VERSION}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve release notes
        id: release_notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_VERSION}" == *+fork.* ]]; then
            cat > release-notes.md <<EOF
          ### English
          This fork release packages the OxideTerm upstream ${RELEASE_VERSION%%+fork.*} baseline with the fork release channel. No additional feature changes are claimed in this release.

          #### Upstream changes
          See the upstream OxideTerm release notes for the included baseline.

          #### Fork-specific changes
          Windows setup and portable packages are provided by this fork release.

          ### 中文
          本次 Fork 发布基于 OxideTerm 上游 ${RELEASE_VERSION%%+fork.*}，并使用 Fork 发布通道。本次发布不额外宣称新增功能。

          #### 上游更新
          本次版本包含的上游基线内容请参阅 OxideTerm 上游发布说明。

          #### Fork 自有更新
          本 Fork 提供 Windows 安装包与便携版压缩包。
          EOF
            {
              echo "channel=fork"
              echo "generate_release_notes=false"
              echo "body_path=release-notes.md"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          notes_channel="stable"
          notes_base=".github/release-notes/stable.md"
          notes_changelog=".github/release-notes/stable-changelog.md"

          if [[ "${RELEASE_TAG}" == gpui-v* || "${RELEASE_VERSION}" == *gpui-preview* || "${RELEASE_VERSION}" == *native-preview* || "${RELEASE_VERSION}" == *rustnative-preview* ]]; then
            notes_channel="gpui-preview"
            notes_base=".github/release-notes/gpui-preview.md"
            notes_changelog=".github/release-notes/gpui-preview-changelog.md"
          elif [[ "${RELEASE_TAG}" == beta-v* || "${RELEASE_TAG}" == native-beta-v* || "${RELEASE_VERSION}" == *beta* ]]; then
            notes_channel="beta"
            notes_base=".github/release-notes/beta.md"
            notes_changelog=".github/release-notes/beta-changelog.md"
          fi

          # Every channel combines channel evergreen text with a single
          # versioned changelog section so release history can stay in Git.
          python3 .github/scripts/compose_release_notes.py \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --base "${notes_base}" \
            --changelog "${notes_changelog}" \
            --output release-notes.md

          {
            echo "channel=${notes_channel}"
            echo "generate_release_notes=false"
            echo "body_path=release-notes.md"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign release assets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          OXIDETERM_UPDATER_PUBKEY: ${{ vars.OXIDETERM_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          if [[ -z "${OXIDETERM_UPDATER_PUBKEY:-}" ]]; then echo "OXIDETERM_UPDATER_PUBKEY is required." >&2; exit 1; fi

          key_path="$(mktemp)"
          public_key_path="$(mktemp)"
          trap 'rm -f "${key_path}" "${public_key_path}"' EXIT
          printf '%s' "${TAURI_SIGNING_PRIVATE_KEY}" | base64 --decode > "${key_path}"
          chmod 600 "${key_path}"
          printf '%s' "${OXIDETERM_UPDATER_PUBKEY}" | base64 --decode > "${public_key_path}"

          # Native and Tauri channel updaters both reject unsigned assets.
          mapfile -t assets < <(find dist-release -maxdepth 1 -type f \( \
            -name '*.app.zip' -o \
            -name '*.dmg' -o \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) | sort -u)

          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No native release assets found to sign." >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            sig="${asset}.sig"
            trusted_comment="OxideTerm ${VERSION} $(basename "${asset}")"
            if [[ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
              printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" \
                | minisign -S -s "${key_path}" -m "${asset}" -x "${sig}" -t "${trusted_comment}"
            else
              minisign -S -W -s "${key_path}" -m "${asset}" -x "${sig}" -t "${trusted_comment}"
            fi
            minisign -V -p "${public_key_path}" -m "${asset}" -x "${sig}"
          done

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checksum_assets < <(find dist-release -maxdepth 1 -type f \( \
            -name '*.app.zip' -o \
            -name '*.dmg' -o \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) | sort -u)

          if [[ "${#checksum_assets[@]}" -eq 0 ]]; then
            echo "No native release assets found for checksum generation." >&2
            exit 1
          fi

          (cd dist-release && sha256sum "${checksum_assets[@]/#dist-release\//}" > sha256sums.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-release/*.app.zip
            dist-release/*.dmg
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/*.exe
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/*.sig
            dist-release/sha256sums.txt
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ needs.validate-release-request.outputs.release_commit }}
          name: OxideTerm Native ${{ steps.release_meta.outputs.version }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          # Stable releases become Latest automatically; prereleases must never
          # displace the current stable release.
          make_latest: ${{ steps.release_meta.outputs.prerelease == 'false' }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: ${{ steps.release_notes.outputs.generate_release_notes }}
          # Re-running a release for the same tag (for example after a partial
          # upload failure) must overwrite in place instead of failing on an
          # existing release.
          update_release: true
          draft: ${{ inputs.fork_release }}

  publish-updater:
    name: Generate updater manifest
    needs:
      - release
      - validate-release-request
    runs-on: ubuntu-latest
    if: inputs.upload_release
    permissions:
      contents: write
    steps:
      - name: Checkout release manifest helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release-request.outputs.release_commit }}

      - name: Build and upload latest.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const isStable = tag.startsWith('v') && !version.includes('-');

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} was not found.`);

            const assets = new Map(release.assets.map((asset) => [asset.name, asset]));
            let platforms = {};

            async function addAsset(keys, assetName) {
              const binaryAsset = assets.get(assetName);
              const sigAsset = assets.get(`${assetName}.sig`);
              if (!binaryAsset || !sigAsset) {
                throw new Error(`Cannot build updater manifest: ${assetName} or its signature is missing`);
              }

              const sigResponse = await fetch(sigAsset.url, {
                headers: {
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  Accept: 'application/octet-stream',
                },
              });
              if (!sigResponse.ok) {
                throw new Error(`failed to download ${sigAsset.name}: HTTP ${sigResponse.status}`);
              }

              // The updater manifest stores base64-encoded minisign text, matching
              // Tauri's update_manager.rs and the native oxideterm-update crate.
              const signatureText = (await sigResponse.text()).trim();
              const signature = Buffer.from(signatureText, 'utf8').toString('base64');
              for (const key of keys) {
                platforms[key] = {
                  signature,
                  url: binaryAsset.browser_download_url,
                };
              }
            }

            if (version.includes('+fork.')) {
              const { buildForkReleasePlatforms } = require(
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/fork_release_manifest.cjs`,
              );
              ({ platforms } = await buildForkReleasePlatforms({
                version, release, token: process.env.GITHUB_TOKEN, fetchImpl: fetch,
              }));
            } else {
              await addAsset(
                ['windows-x86_64', 'windows-x86_64-nsis', 'x86_64-pc-windows-msvc', 'x86_64-pc-windows-msvc-nsis'],
                `OxideTerm_${version}_windows_x64-setup.exe`,
              );
              await addAsset(
                ['windows-x86_64-portable'],
                `OxideTerm_${version}_windows_x64_portable.zip`,
              );
            }

            if (isStable) {
              // OxideTerm 1.x follows the Latest release and probes these
              // installer-specific Tauri keys before their generic fallbacks.
              const tauriCompatibilitySuffixes = new Map([
                ['windows-x86_64-nsis', '.exe'],
              ]);
              for (const [platformKey, expectedSuffix] of tauriCompatibilitySuffixes) {
                const platform = platforms[platformKey];
                if (!platform || !new URL(platform.url).pathname.endsWith(expectedSuffix)) {
                  throw new Error(
                    `Stable updater target ${platformKey} must use a ${expectedSuffix} compatibility package`,
                  );
                }
              }
            }

            if (Object.keys(platforms).length === 0) {
              throw new Error('latest.json would contain no updater platforms');
            }

            const latestJson = {
              version,
              notes: release.body || '',
              pub_date: release.published_at || new Date().toISOString(),
              platforms,
            };

            const existing = release.assets.find((asset) => asset.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }

            const content = JSON.stringify(latestJson, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'latest.json',
              data: content,
              headers: {
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(content),
              },
            });

            core.info(`Uploaded latest.json for ${tag} with ${Object.keys(platforms).length} platform key(s).`);

  cleanup-sigs:
    name: Remove signature helper assets
    needs:
      - release
      - publish-updater
    runs-on: ubuntu-latest
    if: inputs.upload_release
    permissions:
      contents: write
    steps:
      - name: Delete .sig assets from release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} was not found.`);
            const sigAssets = release.assets.filter((asset) => asset.name.endsWith('.sig'));
            for (const asset of sigAssets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }
            core.info(`Deleted ${sigAssets.length} signature helper asset(s).`);

  validate-release-assets:
    name: Validate release assets
    needs:
      - release
      - publish-updater
      - cleanup-sigs
    runs-on: ubuntu-latest
    if: inputs.upload_release
    permissions:
      contents: read
    steps:
      - name: Check final release asset set
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} was not found.`);

            const names = new Set(release.assets.map((asset) => asset.name));
            const isGpuiPreview = tag.startsWith('gpui-v')
              || version.includes('gpui-preview')
              || version.includes('native-preview')
              || version.includes('rustnative-preview');
            if (isGpuiPreview && !(release.body || '').includes('do not download this preview yet')) {
              throw new Error(`Release ${tag} is missing the GPUI preview release-note warning`);
            }

            const expected = [
              'latest.json',
              'sha256sums.txt',
              `OxideTerm_${version}_windows_x64-setup.exe`,
              `OxideTerm_${version}_windows_x64_portable.zip`,
            ];

            const missing = expected.filter((name) => !names.has(name));
            if (missing.length > 0) {
              throw new Error(`Release ${tag} is missing asset(s): ${missing.join(', ')}`);
            }

            const latestAsset = release.assets.find((asset) => asset.name === 'latest.json');
            const latestResponse = await fetch(latestAsset.url, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/octet-stream',
              },
            });
            if (!latestResponse.ok) throw new Error(`failed to download latest.json: HTTP ${latestResponse.status}`);
            const latest = JSON.parse(await latestResponse.text());
            if (latest.version !== version) throw new Error(`latest.json version ${latest.version} does not match ${version}`);
            const assetByName = new Map(release.assets.map((asset) => [asset.name, asset]));
            for (const [key, filename] of [
              ['windows-x86_64', `OxideTerm_${version}_windows_x64-setup.exe`],
              ['windows-x86_64-nsis', `OxideTerm_${version}_windows_x64-setup.exe`],
              ['windows-x86_64-portable', `OxideTerm_${version}_windows_x64_portable.zip`],
            ]) {
              const platform = latest.platforms?.[key];
              const asset = assetByName.get(filename);
              if (!platform || !asset || platform.url !== asset.browser_download_url) {
                throw new Error(`latest.json has an invalid URL for ${key}`);
              }
            }

            const leakedSigs = [...names].filter((name) => name.endsWith('.sig'));
            if (leakedSigs.length > 0) {
              throw new Error(`Release ${tag} still exposes signature helper asset(s): ${leakedSigs.join(', ')}`);
            }

            const checksumAsset = release.assets.find((asset) => asset.name === 'sha256sums.txt');
            const response = await fetch(checksumAsset.url, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/octet-stream',
              },
            });
            if (!response.ok) {
              throw new Error(`failed to download sha256sums.txt: HTTP ${response.status}`);
            }
            const checksumText = await response.text();
            const checksumMissing = expected
              .filter((name) => name !== 'latest.json' && name !== 'sha256sums.txt')
              .filter((name) => !checksumText.includes(`  ${name}`));
            if (checksumMissing.length > 0) {
              throw new Error(`sha256sums.txt is missing asset checksum(s): ${checksumMissing.join(', ')}`);
            }

            core.info(`Validated ${expected.length} release asset(s) for ${tag}.`);

  publish-fork-draft:
    name: Publish completed fork release
    needs: validate-release-assets
    if: inputs.fork_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft after assets and manifest are ready
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === process.env.TAG);
            if (!release) throw new Error(`Release ${process.env.TAG} was not found.`);
            const manifest = release.assets.find((asset) => asset.name === 'latest.json');
            if (!manifest) throw new Error('Refusing to publish without latest.json');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, draft: false,
              make_latest: 'true',
            });
